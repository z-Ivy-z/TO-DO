<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="img/png" href="./img/tarea-completada.png">
</head>
<body>
    <header>
        <h1>TO DO</h1>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    </header>

    <section class="accion">
        <button class="btnAgregar" id="btnAgregar">Agregar</button>
    </section>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="close">&times;</span>
            <form class="task-form" id="taskForm">
                <div class="form-header">
                    <h2>✨ Nueva tarea</h2>
                    <p>Organiza tu día de una forma sencilla.</p>
                </div>

    <!-- Fila 1 -->
                <div class="row">

                    <div class="input-group flex2">
                        <label>Título</label>
                        <input type="text" id="titulo" placeholder="¿Qué debes hacer?">
                    </div>

                    <div class="input-group">
                        <label>Categoría</label>
                        <select id="categoria">
                            <option>Escuela</option>
                            <option>Trabajo</option>
                            <option>Personal</option>
                        </select>
                    </div>

                </div>

    <!-- Descripción -->
                <div class="input-group">
                    <label>Descripción</label>
                    <textarea id="descripcion" rows="3" placeholder="Agrega una descripción..."></textarea>
                </div>

    <!-- Fila 2 -->
                <div class="row">

                    <div class="input-group">
                        <label>Fecha</label>
                        <input type="date" id="fecha">
                    </div>

                    <div class="input-group">
                        <label>Hora</label>
                        <input type="time" id="hora">
                    </div>

                    <div class="input-group">
                        <label>Prioridad</label>
                        <select id="prioridad">
                            <option>🟢 Baja</option>
                            <option>🟡 Media</option>
                            <option>🔴 Alta</option>
                        </select>
                    </div>

                </div>

    <!-- Fila 3 -->
                <div class="row">

                    <div class="input-group flex2">
                        <label>Etiquetas</label>
                        <input type="text" id="etiquetas" placeholder="#Proyecto #Escuela">
                    </div>

                    <div class="input-group">
                        <label>Estado</label>
                        <select id="estado">
                            <option>Pendiente</option>
                            <option>En progreso</option>
                            <option>Completada</option>
                        </select>
                    </div>

                </div>

    <!-- Color -->
                <div class="input-group">

                    <label>Color de la tarjeta</label>

                    <div class="selector-color">

                        <button type="button" class="color" data-color="#F0D9EF"></button>
                        <button type="button" class="color" data-color="#FCDCE1"></button>
                        <button type="button" class="color" data-color="#FFE6BB"></button>
                        <button type="button" class="color" data-color="#E9ECCE"></button>
                        <button type="button" class="color" data-color="#CDE9DC"></button>
                        <button type="button" class="color" data-color="#C4DFE5"></button>

                    </div>

                </div>

    <!-- Botones -->
                <div class="form-buttons">

                    <button type="reset" class="btn-cancelar" id="btnCancelar">
                        Cancelar
                    </button>

                    <button type="submit" class="btn-guardar" id="btnGuardar">
                        Guardar
                    </button>

                </div>
            </form>
        </div>
    </div>
    <section class="pizarron" id="pizarron"></section>
    <script src="script.js"></script>
</body>
</html>
